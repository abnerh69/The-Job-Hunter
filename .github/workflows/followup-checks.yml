name: Follow-up Checks

on:
  schedule:
    - cron: '0 14 * * *'  # Daily at 14:00 UTC (09:00 COT)
  workflow_dispatch:      # Manual trigger

jobs:
  check-followups:
    name: Daily Follow-up Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          database_url: ${{ secrets.DATABASE_URL_PROD }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          digest_to_email: ${{ secrets.DIGEST_TO_EMAIL }}
          dashboard_password: ${{ secrets.DASHBOARD_PASSWORD }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run follow-up checks
        env:
          LOG_FORMAT: json
        run: |
          uv run jobhunter pipeline check-followups > followup-checks-${{ github.run_id }}.jsonl 2>&1

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-checks-logs-${{ github.run_id }}
          path: followup-checks-${{ github.run_id }}.jsonl
          retention-days: 30

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: followup-checks-${{ github.run_id }}.jsonl
