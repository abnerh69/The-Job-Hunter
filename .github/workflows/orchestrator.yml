name: Pipeline Orquestador

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# El orquestador debe reclamar estos permisos para poder delegarlos a la Acción de Jules
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # 1. Acción Asíncrona 1
  validacion_ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2. Acción Asíncrona 2
  # validacion_playwright:
  #   name: Run Playwright
  #   uses: ./.github/workflows/playwright.yml
  #   secrets: inherit

  # 3. Acción Dependiente (Solo corre si las dos anteriores son exitosas)
  ejecucion_jules_flow:
    name: Run Jules Flow
    # needs: [validacion_ci, validacion_playwright]
    needs: [validacion_ci]
    # Solo se lanza si ambas pasaron (implícito al usar 'needs') y si es un Pull Request
    if: success() && github.event_name == 'pull_request'
    uses: ./.github/workflows/jules-auto-flow-on-ci.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
