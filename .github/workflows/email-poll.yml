name: Email Poll

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: email-poll
  cancel-in-progress: false

jobs:
  email-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          database_url: ${{ secrets.DATABASE_URL_PROD }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          dashboard_password: ${{ secrets.DASHBOARD_PASSWORD }}
          gmail_client_id: ${{ secrets.GMAIL_CLIENT_ID }}
          gmail_client_secret: ${{ secrets.GMAIL_CLIENT_SECRET }}
          oauth_encryption_key: ${{ secrets.OAUTH_ENCRYPTION_KEY }}

      - name: Install dependencies
        run: uv sync

      - name: Run email poll and suggest
        id: email-poll
        env:
          LOG_FORMAT: json
          JOBHUNTER_CORRELATION_ID: ${{ github.run_id }}
        run: |
          uv run jobhunter email poll-and-suggest > email-poll-${{ github.run_id }}.jsonl 2>&1

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-poll-${{ github.run_id }}
          path: email-poll-${{ github.run_id }}.jsonl
          retention-days: 30

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: email-poll-${{ github.run_id }}.jsonl
