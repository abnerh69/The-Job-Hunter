[project]
name = "jobhunter"
version = "0.1.0"
description = "Automated job search system for Europe"
authors = [
    { name = "Job Hunter EU Team" }
]
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "tenacity",
    "sqlalchemy>=2.0.30,<3.0",
    "psycopg2-binary",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic",
    "structlog",
    "typer",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.14.3",
    "rich==13.9.4",
    "jinja2>=3.1.6",
    "python-telegram-bot[asyncio]>=22.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
    "vcrpy>=8.1.1",
    "pytest-recording>=0.13.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/jobhunter"]
branch = true
