name: Pipeline Cycle

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum jobs per source to ingest'
        required: false
        type: number
      source:
        description: 'Specific sources to run (comma separated names)'
        required: false
        type: string

concurrency:
  group: pipeline-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    name: Run Pipeline Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          database_url: ${{ secrets.DATABASE_URL_PROD }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          dashboard_password: ${{ secrets.DASHBOARD_PASSWORD }}

      - name: Run Pipeline Cycle
        shell: bash
        env:
          LOG_FORMAT: json
        run: |
          # Build arguments for limit and source if provided
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            # Split comma-separated sources and strip spaces
            IFS=',' read -ra ADDR <<< "${{ github.event.inputs.source }}"
            for i in "${ADDR[@]}"; do
              trimmed=$(echo "$i" | xargs)
              if [ -n "$trimmed" ]; then
                ARGS="$ARGS --source $trimmed"
              fi
            done
          fi

          uv run jobhunter pipeline run-cycle $ARGS > pipeline-${{ github.run_id }}.jsonl 2>&1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: pipeline-${{ github.run_id }}.jsonl
          retention-days: 30

      - name: Action Summary
        if: always()
        run: |
          if [ -f pipeline-${{ github.run_id }}.jsonl ]; then
            echo "### 🚀 Pipeline Cycle Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract JSON block and format it as a table
            # We use tail -n +1 to ensure we process everything, then grep for a characteristic field
            JSON_BLOCK=$(grep "overall_status" pipeline-${{ github.run_id }}.jsonl | tail -n 1)

            if [ -n "$JSON_BLOCK" ]; then
              STATUS=$(echo $JSON_BLOCK | jq -r '.overall_status')
              DURATION=$(echo $JSON_BLOCK | jq -r '.total_duration_ms')

              echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              echo "| **Status** | $STATUS |" >> $GITHUB_STEP_SUMMARY
              echo "| **Duration** | ${DURATION}ms |" >> $GITHUB_STEP_SUMMARY

              # Ingestion stats
              ING_NEW=$(echo $JSON_BLOCK | jq -r '.ingestion.total_new // 0')
              ING_ERR=$(echo $JSON_BLOCK | jq -r '.ingestion.total_errors // 0')
              echo "| **Ingested (New/Err)** | $ING_NEW / $ING_ERR |" >> $GITHUB_STEP_SUMMARY

              # Scoring stats
              SC_OK=$(echo $JSON_BLOCK | jq -r '.scoring.success_count // 0')
              SC_FAIL=$(echo $JSON_BLOCK | jq -r '.scoring.failed_count // 0')
              SC_COST=$(echo $JSON_BLOCK | jq -r '.scoring.total_cost_usd // 0')
              echo "| **Scored (OK/Fail)** | $SC_OK / $SC_FAIL |" >> $GITHUB_STEP_SUMMARY
              echo "| **LLM Cost** | \$$SC_COST |" >> $GITHUB_STEP_SUMMARY

              # Dispatch stats
              DISP_OK=$(echo $JSON_BLOCK | jq -r '.dispatch.success_count // 0')
              echo "| **Notified** | $DISP_OK |" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Could not parse machine report from logs." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Alert on Failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: pipeline-${{ github.run_id }}.jsonl
