name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter_local
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobhunter:jobhunter_local@localhost:5432/jobhunter
      ANTHROPIC_API_KEY: dummy_key_for_ci
      DASHBOARD_PASSWORD: dummy_password_for_ci
      TELEGRAM_BOT_TOKEN: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
      TELEGRAM_CHAT_ID: 123456789
      PYTHONPATH: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install Playwright Browsers
        run: uv run playwright install chromium

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage (excluding E2E)
        run: uv run pytest -v --cov --ignore=tests/e2e
