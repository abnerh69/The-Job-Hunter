name: Monthly Analytics Report

on:
  schedule:
    - cron: '0 8 1 * *' # Day 1 of each month at 08:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to report on (YYYY-MM). Defaults to last month if empty.'
        required: false
        default: ''

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: monthly-report
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          smtp_user: ${{ secrets.SMTP_USER }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          digest_to_email: ${{ secrets.DIGEST_TO_EMAIL }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          dashboard_password: ${{ secrets.DASHBOARD_PASSWORD }}

      - name: Generate and Send Monthly Report
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          uv run jobhunter analytics report $MONTH_ARG --output pdf --send-email

      - name: Alert on Failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          workflow_name: "Monthly Analytics Report"
