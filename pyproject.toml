[project]
name = "jobhunter"
version = "0.1.0"
description = "Automated job search system for Europe"
authors = [
    { name = "Job Hunter EU Team" }
]
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "tenacity",
    "sqlalchemy>=2.0.30,<3.0",
    "psycopg2-binary",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic",
    "structlog",
    "typer",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.14.3",
    "rich==13.9.4",
    "jinja2>=3.1.6",
    "python-telegram-bot[asyncio]>=22.7",
    "aiosmtplib>=3.0.1",
    "streamlit>=1.57.0",
    "playwright>=1.59.0",
    "pytest-playwright>=0.7.2",
    "plotly>=6.7.0",
    "cryptography>=47.0.0",
    "google-auth>=2.49.2",
    "google-auth-oauthlib>=1.3.1",
    "google-api-python-client>=2.194.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio==0.23.6",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
    "vcrpy>=8.1.1",
    "pytest-recording>=0.13.4",
    "pandas-stubs>=3.0.0.260204",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end dashboard tests",
]

[tool.coverage.run]
source = ["src/jobhunter"]
branch = true
